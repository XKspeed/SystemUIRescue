name: Release

on:
  # 只手动触发：一键发布 —— Actions 页面点 Run workflow，
  # tag 留空则自动取 build.gradle.kts 的 versionName。
  # 不挂 push / tag 触发，避免每次提交都发一个 Release。
  workflow_dispatch:
    inputs:
      tag:
        description: '发布标签（如 v1.0.0）；留空自动取 versionName'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 把 Secrets 里的 keystore（jks 的 base64 单行文本）解码回文件。
      # 解码后立刻按别名校验：内容不对时在这一步就报明确错误，
      # 而不是等到 packageRelease 才抛难懂的 "Tag number over 30 is not supported"
      - name: Decode signing key
        env:
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          # 先落盘再解码：容忍复制时混入的换行/空格，也避免密钥内容被 shell 解释
          cat > /tmp/signing-key.b64 <<'B64_EOF'
          ${{ secrets.SIGNING_KEY }}
          B64_EOF
          B64=$(tr -d '[:space:]' < /tmp/signing-key.b64)
          # 下面只打印元信息（长度/字节数），绝不打印密钥内容本身
          echo "SIGNING_KEY 字符数（去空白后）: ${#B64}"

          # ① 变量是否配了
          if [ "${#B64}" -eq 0 ]; then
            echo "::error::SIGNING_KEY 为空 —— Secrets 里没配这个变量（或名字不一致）"
            exit 1
          fi
          if [ -z "${KEY_STORE_PASSWORD}" ]; then
            echo "::error::KEY_STORE_PASSWORD 为空 —— Secrets 里没配，应为 SysUI@Mount2026"
            exit 1
          fi
          if [ -z "${KEY_ALIAS}" ]; then
            echo "::error::KEY_ALIAS 为空 —— Secrets 里没配，应为 systemuimount"
            exit 1
          fi

          # ② 内容是否像 base64（粘了 jks 二进制会在这里露馅）
          if printf '%s' "$B64" | grep -q '[^A-Za-z0-9+/=]'; then
            echo "::error::SIGNING_KEY 含有非 base64 字符 —— 多半把 jks 二进制内容粘进去了，必须是「jks 文件的 base64 文本」"
            exit 1
          fi

          # ③ 解码
          printf '%s' "$B64" | base64 -d > app/release-key.jks
          echo "解码后字节数: $(wc -c < app/release-key.jks)（正确应为 2758）"
          rm -f /tmp/signing-key.b64

          # ④ 格式 + store 密码（这一步失败 = 产物损坏 或 storePassword 不对）
          if ! keytool -list -keystore app/release-key.jks -storetype pkcs12 \
              -storepass "$KEY_STORE_PASSWORD" >/dev/null 2>&1; then
            echo "::error::keystore 打不开 —— 要么解码产物不完整（SIGNING_KEY 被截断），要么 KEY_STORE_PASSWORD 不对（应为 SysUI@Mount2026）"
            exit 1
          fi

          # ⑤ 别名是否存在（能打开但别名不对 = KEY_ALIAS 填错）
          if ! keytool -list -keystore app/release-key.jks -storetype pkcs12 \
              -storepass "$KEY_STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::keystore 能打开，但找不到别名 $KEY_ALIAS —— KEY_ALIAS 应为 systemuimount"
            exit 1
          fi
          echo "keystore 校验通过（alias=$KEY_ALIAS）"

      # 解析发布标签：手动输入优先，留空则从 build.gradle.kts 读 versionName
      - name: Resolve version tag
        id: version
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
            TAG="v${VERSION}"
          fi
          # 去掉开头的 v 得到纯版本号（如 1.0.0）
          VERSION_NAME="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "发布标签: ${TAG}（版本 ${VERSION_NAME}）"

      # 密码通过环境变量传给 Gradle（build.gradle.kts 读取）
      - name: Build release APK
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon

      # 确认密钥真的用上了：没签名的包也能构建出来，只有验证过才算数
      - name: Verify APK signature
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          SDK_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          TOOLS=$(ls -d "${SDK_HOME}"/build-tools/*/ 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "${TOOLS}" ] && [ -x "${TOOLS}apksigner" ]; then
            "${TOOLS}apksigner" verify --print-certs "${APK}"
            echo "apksigner 验证通过"
          else
            # 没有 apksigner 时退化为检查 Jar 签名块
            if ! unzip -l "${APK}" | grep -q "META-INF/.*\.RSA"; then
              echo "::error::产物未签名（缺少 META-INF/*.RSA）"
              exit 1
            fi
            echo "签名校验通过（存在 META-INF/*.RSA）"
          fi

      # 幂等：同一版本一键重发时，先删掉旧 tag 再打新的
      - name: Create / update tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TAG="${{ steps.version.outputs.tag }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            git push origin ":refs/tags/${TAG}" 2>/dev/null || true
            git tag -d "${TAG}" 2>/dev/null || true
          fi
          git tag "${TAG}"
          git push origin "${TAG}"

      # 本次 Release 说明取自 update.md 顶部最新一段：
      # update.md 由我们维护 —— 新版本内容写在文件顶部，历史段落自然下移留档，
      # 工作流只取顶部那一段，保证每个 Release 只描述自己这个版本。
      - name: Extract release notes
        run: |
          if [ -f update.md ]; then
            awk '/^## /{c++} c==1' update.md > release_notes.md
          fi
          if [ ! -s release_notes.md ]; then
            printf '详见下方提交记录。\n' > release_notes.md
          fi
          echo "--- 本次 Release 说明 ---"
          cat release_notes.md

      # 构建完直接发布 Release（手动触发与 tag 推送都会执行），附带签名 APK
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.version_name }}
          body_path: release_notes.md
          files: app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release.apk
